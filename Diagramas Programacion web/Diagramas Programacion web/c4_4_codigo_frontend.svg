  <text x="850" y="150" text-anchor="middle" font-size="10" fill="#94a3b8">Login principal</text>
  <line x1="760" y1="125" x2="622" y2="125" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#p1)"/>

