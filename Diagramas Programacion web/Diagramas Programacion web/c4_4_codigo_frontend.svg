  <text x="137" y="317" text-anchor="middle" font-size="10" fill="#e0f2fe">Listado y gestión</text>
  <text x="137" y="332" text-anchor="middle" font-size="10" fill="#e0f2fe">de turnos</text>

  <rect x="235" y="250" width="155" height="100" rx="8" fill="#15803d"/>
