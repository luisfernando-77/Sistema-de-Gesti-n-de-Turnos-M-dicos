  <text x="890" y="573" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Backend API</text>
  <text x="890" y="591" text-anchor="middle" font-size="10" fill="#bbf7d0">NestJS :3001</text>
  <text x="890" y="606" text-anchor="middle" font-size="10" fill="#bbf7d0">REST / JSON</text>
  <line x1="818" y1="490" x2="890" y2="543" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#p4)"/>

