  <text x="145" y="456" text-anchor="middle" font-size="10" fill="#93c5fd">GET/POST/PUT/DELETE</text>
  <text x="145" y="471" text-anchor="middle" font-size="10" fill="#93c5fd">/api/turnos</text>

  <rect x="250" y="410" width="170" height="80" rx="8" fill="#1e3a5f"/>
  <text x="335" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">pacientes.service.ts</text>
  <text x="335" y="456" text-anchor="middle" font-size="10" fill="#93c5fd">GET/POST/PUT/DELETE</text>
