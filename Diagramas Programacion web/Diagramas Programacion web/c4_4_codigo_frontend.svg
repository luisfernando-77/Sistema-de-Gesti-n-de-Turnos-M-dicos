  <text x="525" y="456" text-anchor="middle" font-size="10" fill="#93c5fd">GET/POST/PUT/DELETE</text>
  <text x="525" y="471" text-anchor="middle" font-size="10" fill="#93c5fd">/api/medicos</text>

