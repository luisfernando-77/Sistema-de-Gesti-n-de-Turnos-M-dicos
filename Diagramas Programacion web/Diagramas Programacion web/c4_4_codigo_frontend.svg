<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="660" fill="#f0f4f8" rx="12"/>
  <text x="500" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2e4a">Frontend — Next.js 15</text>
