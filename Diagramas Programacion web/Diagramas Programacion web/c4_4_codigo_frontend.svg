  <text x="260" y="613" text-anchor="middle" font-size="10" fill="#d1d5db">TypeScript interfaces para tipado</text>

  <rect x="490" y="545" width="325" height="80" rx="8" fill="#374151"/>
  <text x="652" y="573" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">app/lib/api.ts + components/</text>
