  <text x="722" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">especialidades.service.ts</text>
  <text x="722" y="456" text-anchor="middle" font-size="10" fill="#93c5fd">GET/POST/PUT/DELETE</text>
  <text x="722" y="471" text-anchor="middle" font-size="10" fill="#93c5fd">/api/especialidades</text>

