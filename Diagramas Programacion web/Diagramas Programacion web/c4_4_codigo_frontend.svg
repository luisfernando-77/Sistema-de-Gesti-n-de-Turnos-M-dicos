  <line x1="312" y1="352" x2="320" y2="408" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#p3)"/>
  <line x1="487" y1="352" x2="510" y2="408" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#p3)"/>
  <line x1="662" y1="352" x2="700" y2="408" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#p3)"/>

