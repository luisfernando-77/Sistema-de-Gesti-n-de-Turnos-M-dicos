  <line x1="530" y1="182" x2="747" y2="368" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#b4)"/>
  <line x1="490" y1="182" x2="430" y2="538" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#b4)"/>

