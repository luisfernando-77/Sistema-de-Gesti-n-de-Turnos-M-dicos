  <line x1="236" y1="490" x2="860" y2="538" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#b5)"/>
  <line x1="690" y1="490" x2="860" y2="538" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#b5)"/>

