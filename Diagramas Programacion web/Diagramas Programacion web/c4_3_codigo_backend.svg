<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="680" fill="#f0f4f8" rx="12"/>
  <text x="500" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2e4a">Backend — NestJS</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#5a7184">Diagrama C4 — Nivel 3: Código Backend</text>
  <line x1="60" y1="66" x2="940" y2="66" stroke="#c0cdd8" stroke-width="1.5"/>

