  <text x="500" y="143" text-anchor="middle" font-size="10" fill="#93c5fd">app.module.ts</text>
  <text x="500" y="158" text-anchor="middle" font-size="10" fill="#93c5fd">Raíz de la aplicación NestJS</text>

  <!-- main.ts -->
  <rect x="780" y="90" width="160" height="70" rx="8" fill="#374151"/>
  <text x="860" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">main.ts</text>
