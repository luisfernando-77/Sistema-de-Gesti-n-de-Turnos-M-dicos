<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="580" fill="#f0f4f8" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2e4a">Sistema de Gestión de Turnos Médicos</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#5a7184">Diagrama C4 — Nivel 1: Contexto del Sistema</text>
  <line x1="60" y1="66" x2="840" y2="66" stroke="#c0cdd8" stroke-width="1.5"/>

  <!-- Sistema central -->
  <rect x="310" y="200" width="280" height="150" rx="10" fill="#2563eb"/>
  <text x="450" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Sistema de Gestión</text>
  <text x="450" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">de Turnos Médicos</text>
  <line x1="330" y1="285" x2="570" y2="285" stroke="#93c5fd" stroke-width="1"/>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#bfdbfe">NestJS + Next.js + PostgreSQL</text>
  <text x="450" y="319" text-anchor="middle" font-size="11" fill="#bfdbfe">Gestión de turnos médicos</text>
  <text x="450" y="335" text-anchor="middle" font-size="11" fill="#bfdbfe">digitales en clínicas</text>

  <!-- Paciente -->
  <text x="110" y="185" text-anchor="middle" font-size="28">🧑</text>
  <rect x="50" y="200" width="120" height="80" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="110" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">Paciente</text>
  <line x1="70" y1="230" x2="150" y2="230" stroke="#7dd3fc" stroke-width="1"/>
  <text x="110" y="248" text-anchor="middle" font-size="10" fill="#0369a1">Solicita y consulta</text>
  <text x="110" y="262" text-anchor="middle" font-size="10" fill="#0369a1">sus turnos médicos</text>
  <line x1="172" y1="250" x2="308" y2="270" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="230" y="248" text-anchor="middle" font-size="9" fill="#0369a1">Consulta / Registra</text>

  <!-- Médico -->
  <text x="110" y="405" text-anchor="middle" font-size="28">🩺</text>
  <rect x="50" y="420" width="120" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Médico</text>
  <line x1="70" y1="450" x2="150" y2="450" stroke="#86efac" stroke-width="1"/>
  <text x="110" y="468" text-anchor="middle" font-size="10" fill="#15803d">Gestiona agenda</text>
  <text x="110" y="482" text-anchor="middle" font-size="10" fill="#15803d">y atiende pacientes</text>
  <line x1="172" y1="455" x2="308" y2="355" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="228" y="418" text-anchor="middle" font-size="9" fill="#15803d">Atiende turnos</text>

  <!-- Administrador -->
  <text x="790" y="185" text-anchor="middle" font-size="28">👨‍💼</text>
  <rect x="730" y="200" width="120" height="80" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="790" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Administrador</text>
  <line x1="750" y1="230" x2="830" y2="230" stroke="#d8b4fe" stroke-width="1"/>
  <text x="790" y="248" text-anchor="middle" font-size="10" fill="#7e22ce">Gestiona médicos,</text>
  <text x="790" y="262" text-anchor="middle" font-size="10" fill="#7e22ce">especialidades, consultorios</text>
  <line x1="728" y1="250" x2="592" y2="270" stroke="#9333ea" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="672" y="248" text-anchor="middle" font-size="9" fill="#7e22ce">Administra sistema</text>

  <!-- BD PostgreSQL -->
  <text x="790" y="400" text-anchor="middle" font-size="28">🗄️</text>
  <rect x="730" y="415" width="120" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="790" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">PostgreSQL</text>
  <text x="790" y="455" text-anchor="middle" font-size="10" fill="#c2410c">vía Prisma ORM</text>
  <text x="790" y="470" text-anchor="middle" font-size="10" fill="#c2410c">Base de Datos</text>
  <line x1="592" y1="340" x2="728" y2="420" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="666" y="378" text-anchor="middle" font-size="9" fill="#c2410c">Lee / Escribe</text>

  <!-- Docker -->
  <text x="450" y="490" text-anchor="middle" font-size="28">🐳</text>
  <rect x="360" y="502" width="180" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Docker Compose</text>
  <text x="450" y="540" text-anchor="middle" font-size="10" fill="#1d4ed8">Entorno de despliegue</text>
  <line x1="450" y1="502" x2="450" y2="352" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#abl)"/>

  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/></marker>
    <marker id="abl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
