<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#f0f4f8" rx="12"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2e4a">Sistema de Gestión de Turnos Médicos</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#5a7184">Diagrama C4 — Nivel 2: Contenedores</text>
  <line x1="60" y1="66" x2="900" y2="66" stroke="#c0cdd8" stroke-width="1.5"/>

  <!-- Boundary del sistema -->
  <rect x="200" y="130" width="560" height="390" rx="12" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="480" y="122" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">[Sistema de Software] Sistema de Gestión de Turnos Médicos</text>

  <!-- Frontend Next.js -->
  <rect x="220" y="150" width="220" height="130" rx="10" fill="#0ea5e9"/>
  <text x="330" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Frontend</text>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#bae6fd">[Next.js 15 / React]</text>
  <line x1="240" y1="220" x2="420" y2="220" stroke="#7dd3fc" stroke-width="1"/>
  <text x="330" y="237" text-anchor="middle" font-size="10" fill="#e0f7ff">Dashboard, Pacientes,</text>
  <text x="330" y="251" text-anchor="middle" font-size="10" fill="#e0f7ff">Médicos, Turnos, Citas</text>
  <text x="330" y="265" text-anchor="middle" font-size="10" fill="#e0f7ff">Puerto: 3000</text>

  <!-- Backend NestJS -->
  <rect x="520" y="150" width="220" height="130" rx="10" fill="#16a34a"/>
  <text x="630" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Backend API</text>
  <text x="630" y="210" text-anchor="middle" font-size="11" fill="#bbf7d0">[NestJS / TypeScript]</text>
  <line x1="540" y1="220" x2="720" y2="220" stroke="#86efac" stroke-width="1"/>
  <text x="630" y="237" text-anchor="middle" font-size="10" fill="#f0fff4">REST API con módulos:</text>
  <text x="630" y="251" text-anchor="middle" font-size="10" fill="#f0fff4">Turnos, Médicos, Pacientes</text>
  <text x="630" y="265" text-anchor="middle" font-size="10" fill="#f0fff4">Puerto: 3001</text>

  <!-- Prisma ORM -->
  <rect x="370" y="330" width="220" height="110" rx="10" fill="#7c3aed"/>
  <text x="480" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Prisma ORM</text>
  <text x="480" y="386" text-anchor="middle" font-size="11" fill="#ddd6fe">[ORM / Migrations]</text>
  <line x1="390" y1="396" x2="570" y2="396" stroke="#c4b5fd" stroke-width="1"/>
  <text x="480" y="413" text-anchor="middle" font-size="10" fill="#ede9fe">Modelos: Turno, Médico,</text>
  <text x="480" y="428" text-anchor="middle" font-size="10" fill="#ede9fe">Paciente, Consultorio, Esp.</text>

  <!-- PostgreSQL -->
  <rect x="680" y="420" width="180" height="80" rx="10" fill="#ea580c"/>
  <text x="770" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">PostgreSQL</text>
  <text x="770" y="473" text-anchor="middle" font-size="11" fill="#fed7aa">[Base de Datos]</text>
  <text x="770" y="488" text-anchor="middle" font-size="10" fill="#fff7ed">Puerto: 5432</text>

  <!-- Docker -->
  <rect x="100" y="420" width="180" height="80" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Docker Compose</text>
  <text x="190" y="470" text-anchor="middle" font-size="11" fill="#bfdbfe">[Infraestructura]</text>
  <text x="190" y="485" text-anchor="middle" font-size="10" fill="#dbeafe">Orquesta contenedores</text>

  <!-- Actores externos -->
  <text x="100" y="180" text-anchor="middle" font-size="24">🧑</text>
  <rect x="50" y="192" width="100" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="100" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Paciente /</text>
  <text x="100" y="228" text-anchor="middle" font-size="11" fill="#0369a1">Administrador</text>

  <text x="860" y="180" text-anchor="middle" font-size="24">🩺</text>
  <rect x="820" y="192" width="100" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="870" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Médico</text>

  <!-- Flechas -->
  <!-- Usuario -> Frontend -->
  <line x1="152" y1="217" x2="218" y2="217" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#f1)"/>
  <text x="185" y="210" text-anchor="middle" font-size="9" fill="#0369a1">HTTPS</text>

  <!-- Médico -> Frontend -->
  <line x1="818" y1="217" x2="742" y2="217" stroke="#16a34a" stroke-width="1.8" marker-end="url(#f2)"/>
  <text x="780" y="210" text-anchor="middle" font-size="9" fill="#15803d">HTTPS</text>

  <!-- Frontend -> Backend -->
  <line x1="442" y1="215" x2="518" y2="215" stroke="#fff" stroke-width="2" marker-end="url(#f3)"/>
  <text x="480" y="207" text-anchor="middle" font-size="9" fill="#1a2e4a">REST API / JSON</text>

  <!-- Backend -> Prisma -->
  <line x1="630" y1="282" x2="570" y2="328" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#f4)"/>
  <text x="614" y="315" text-anchor="middle" font-size="9" fill="#7c3aed">Queries</text>

  <!-- Prisma -> PostgreSQL -->
  <line x1="592" y1="420" x2="695" y2="440" stroke="#ea580c" stroke-width="1.8" marker-end="url(#f5)"/>
  <text x="644" y="428" text-anchor="middle" font-size="9" fill="#ea580c">SQL</text>

  <!-- Docker engloba todo -->
  <line x1="190" y1="420" x2="340" y2="360" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#f6)"/>
  <text x="248" y="385" text-anchor="middle" font-size="9" fill="#1d4ed8">Contiene</text>

  <defs>
    <marker id="f1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="f2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
    <marker id="f3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker>
    <marker id="f4" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <marker id="f5" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/></marker>
    <marker id="f6" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
